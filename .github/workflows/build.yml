name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf openpyxl pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean Ilce_PDF_Birlestirici.spec

      - name: Test EXE
        shell: pwsh
        run: |
          $exe = "dist\Ilce_PDF_Birlestirici.exe"
          if (-not (Test-Path $exe)) { throw "EXE uretilmedi" }
          $size = (Get-Item $exe).Length
          Write-Host "EXE boyutu: $size bayt"
          if ($size -lt 5000000) { throw "EXE beklenenden kucuk" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ilce-PDF-Birlestirici-exe
          path: dist/Ilce_PDF_Birlestirici.exe
          if-no-files-found: error
