name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kur
        run: |
          python -m pip install --upgrade pip
          pip install pypdf pdfplumber openpyxl pyinstaller

      - name: EXE olustur
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name "PDF Birlestirici" ^
            --collect-all pdfminer ^
            --hidden-import pdfplumber ^
            --hidden-import openpyxl ^
            gui.py

      - name: EXE'yi test et
        run: |
          $exe = "dist\PDF Birlestirici.exe"
          if (-not (Test-Path $exe)) { throw "EXE uretilmedi" }
          $size = (Get-Item $exe).Length
          Write-Host "EXE boyutu: $size bayt"
          if ($size -lt 5000000) { throw "EXE beklenenden kucuk, bagimliliklar eksik olabilir" }

      - name: Yukle
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Birlestirici-exe
          path: dist/*.exe
          if-no-files-found: error